# Peilaa pelin kuvat, liput ja äänet omaan ämpäriin (Cloudflare R2).
#
# Ennen tätä peilattu aineisto asui omassa repossaan
# (ravelius/Matkakirja-media): työkalu kirjoitti sinne, repo julkaistiin
# GitHub Pagesissa ja peli haki tiedostot sieltä. Aineisto kasvoi yli
# Pagesin suositusrajan (1 Gt sivustoa kohti), joten kaikki siirtyi
# ämpäriin — ja silloin erillinen repo jäi tarpeettomaksi.
#
# Nyt ämpäri itse on varasto: ajo noutaa sieltä nykyisen aineiston,
# peilaa vain puuttuvat tiedostot ja vie tuloksen takaisin. Peilattua
# aineistoa ei siis säilytetä missään repossa, mutta työkalu ja lista
# siitä mitä peilataan ovat täällä pelin oman sisällön vieressä.
#
# Ajo käynnistyy itsestään (omistajan toive) eikä sitä tarvitse muistaa
# ajaa käsin. Kolme tapaa:
#
#   1. Push mainiin, joka koskee pakettitiedostoja tai peilaustyökalua.
#      Juuri silloin peiliin on voinut tulla uutta aineistoa; muut
#      muutokset (tyylit, dokumentit, pelilogiikka) eivät käynnistä ajoa.
#   2. Kerran viikossa. Jos jokin lähde oli poikki peilaushetkellä, tiedosto
#      jäi puuttumaan hiljaa — viikkoajo poimii sen kun lähde palaa.
#   3. Käsin Actions-välilehdeltä, jolloin voi valita yhden lajin.
#
# Aiempi kommentti varoitti, ettei tätä saa ajaa pushista, koska ajo kestää
# kymmeniä minuutteja. Se pätee vain ensimmäiseen ajoon: kun ämpärissä on jo
# kaikki, ajo vertaa tilanteen ja lopettaa. Mitattu 2.8.2026: koko kierros
# 56 sekuntia, josta noudon osuus 37 s. Pitkä ajo tulee vain silloin, kun
# uutta aineistoa on oikeasti paljon — ja silloin sitä pitääkin odottaa.
#
# Rinnakkaiset ajot eivät ole vaara: concurrency-ryhmä pitää ne jonossa
# (alempana), eikä vienti käytä --deleteä.
#
# Salaisuudet ovat tämän repon Actions-asetuksissa eivätkä koskaan
# täällä:
#   R2_ACCOUNT_ID  R2_ACCESS_KEY_ID  R2_SECRET_ACCESS_KEY  R2_BUCKET

name: Peilaa media R2:een

on:
  push:
    branches: [main]
    paths:
      # Kaikki peilattava on määritelty paketeissa: kuvien ja äänten
      # osoitteet ovat korttien tiedoissa.
      - 'js/packs/**'
      # Työkalu päättää mitä ja miten peilataan.
      - 'tools/peilaa-media.mjs'
      - 'tools/leikkaa-mp3.mjs'
      # Ajo itse: näin sen muutokset tulevat kokeilluiksi heti eivätkä
      # jää piiloon seuraavaan kertaan asti.
      - '.github/workflows/peilaa.yml'
  schedule:
    # Sunnuntaisin 04:15 UTC. Vartin yli, koska tasatunnit ovat GitHubilla
    # ruuhkaisimmat ja ajo voi silloin jäädä odottamaan konetta.
    - cron: '15 4 * * 0'
  workflow_dispatch:
    inputs:
      lajit:
        description: 'Mitkä lajit peilataan'
        type: choice
        default: 'kaikki'
        options: ['kaikki', 'kuvat', 'liput', 'aanet']

permissions:
  contents: read

# Yksi ajo kerrallaan: kaksi rinnakkaista kirjoittaisi ämpäriin
# päällekkäin ja manifesti menisi sekaisin.
concurrency:
  group: peilaa-media
  cancel-in-progress: false

jobs:
  peilaa:
    runs-on: ubuntu-latest
    # Täysi ajo kestää tunnin luokkaa: jokaisesta tiedostosta
    # tarkistetaan koko lähteestä, ja lähteet ovat hitaita.
    timeout-minutes: 300
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 ei hyväksy AWS:n uudempia tarkistussummaotsakkeita, jotka
      # aws-cli 2.23:sta alkaen lähtevät oletuksena mukaan.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_supported
      JULKINEN: https://pub-7bc0ed2083a74a68bd7115618bca4709.r2.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Puuttuva salaisuus tulee muuten vastaan vasta aws-clin virheenä
      # "Invalid endpoint: https://.r2.cloudflarestorage.com", josta ei
      # arvaa mistä on kyse. Näin ajo kertoo heti mikä nimi puuttuu.
      # Arvoja ei tulosteta, vain onko ne asetettu.
      - name: Tarkista että salaisuudet ovat tallessa
        env:
          TILI: ${{ secrets.R2_ACCOUNT_ID }}
          AVAIN: ${{ secrets.R2_ACCESS_KEY_ID }}
          SALAISUUS: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AMPARI: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          puuttuu=""
          [ -n "$TILI" ]      || puuttuu="$puuttuu R2_ACCOUNT_ID"
          [ -n "$AVAIN" ]     || puuttuu="$puuttuu R2_ACCESS_KEY_ID"
          [ -n "$SALAISUUS" ] || puuttuu="$puuttuu R2_SECRET_ACCESS_KEY"
          [ -n "$AMPARI" ]    || puuttuu="$puuttuu R2_BUCKET"
          if [ -n "$puuttuu" ]; then
            echo "::error::Näitä salaisuuksia ei löydy tästä reposta:$puuttuu"
            echo "Lisää ne osoitteessa Settings > Secrets and variables >"
            echo "Actions > Repository secrets. Huomaa: salaisuudet ovat"
            echo "repokohtaisia — toiseen repoon lisätyt eivät näy täällä."
            exit 1
          fi
          echo "Kaikki neljä salaisuutta löytyvät."

      - name: Nouda nykyinen peili ämpäristä
        run: |
          set -euo pipefail
          mkdir -p media
          aws s3 sync "s3://${{ secrets.R2_BUCKET }}" media \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --no-progress
          du -sh media
          for kansio in kuvat liput aanet; do
            echo "$kansio: $(ls media/$kansio 2>/dev/null | wc -l) tiedostoa"
          done

      - name: Peilaa puuttuvat
        env:
          # Lajivalinta on olemassa vain käsin käynnistettäessä. Pushista ja
          # ajastuksesta inputs.lajit on tyhjä merkkijono, jolloin alla oleva
          # vertailu ohittaisi kaikki lajit ja ajo menisi läpi vihreänä
          # peilaamatta mitään. Oletus on siksi pakko antaa tässä.
          LAJIT: ${{ inputs.lajit || 'kaikki' }}
        run: |
          set -euo pipefail
          # Työkalu ajetaan laji kerrallaan, jotta tekstihaku
          # (--vain tekstit) jää pois: se lataa satoja wikiartikkeleita
          # kirjoittamisen raaka-aineeksi eikä kuulu ämpäriin.
          # Osittainen ajo säilyttää muiden lajien merkinnät manifestissa.
          ajettu=0
          for laji in kuvat liput aanet; do
            if [ "$LAJIT" != "kaikki" ] && [ "$LAJIT" != "$laji" ]; then continue; fi
            echo "::group::$laji"
            node tools/peilaa-media.mjs --ulos media --vain "$laji"
            echo "::endgroup::"
            ajettu=$((ajettu + 1))
          done
          # Vihreä ajo, joka ei peilannut mitään, on pahempi kuin punainen:
          # se näyttää siltä että aineisto on kunnossa.
          if [ "$ajettu" -eq 0 ]; then
            echo "::error::Yhtään lajia ei peilattu (LAJIT='$LAJIT')."
            exit 1
          fi

      # tests/media.test.mjs vertaa pelin polkusäännön manifestiin, mutta
      # ohittaa itsensä hiljaa jos manifestia ei ole koneella. Nyt se on:
      # äsken kirjoitettu media/manifesti.json. Tämä on ainoa paikka
      # missä tarkistus ajetaan koko aineistoa vasten — ilman sitä
      # eriytynyt nimeäminen huomattaisiin vasta pelissä puuttuvana
      # kuvana.
      #
      # TARKISTUS ON PEILAUKSEN JÄLKEEN, EI ENNEN. Ennen se ajettiin
      # heti ämpäristä noudon jälkeen, ja se lukitsi ajon: jos
      # ämpärissä ollut manifesti oli säännön kanssa ristiriidassa,
      # testi kaatui ennen kuin peilaus ehti kirjoittaa uuden. Ainoa
      # ajo, joka olisi voinut korjata manifestin, oli se joka ei
      # koskaan päässyt alkuun. Sen manifestin sisällölle ei tässä
      # vaiheessa voi enää tehdä mitään — se on mennyttä aikaa.
      #
      # Tässä kohtaa tarkistuksella on merkitystä: se katsoo juuri sitä
      # manifestia, joka on lähdössä ämpäriin, ja estää rikkinäisen
      # manifestin julkaisemisen. Vartija on siis tiukempi kuin ennen —
      # se vahtii kirjoitusta, ei lukemista. Peilaus ehtii tehdä turhaa
      # työtä ennen kaatumista, mutta sen työ on joka tapauksessa
      # talletettu levylle eikä ämpäriin.
      - name: Tarkista polkusäännöt manifestia vasten
        run: node --test tests/media.test.mjs

      - name: Vie ämpäriin
        run: |
          set -euo pipefail
          paate="--endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          ampari="s3://${{ secrets.R2_BUCKET }}"
          for kansio in kuvat liput aanet; do
            [ -d "media/$kansio" ] || continue
            aws s3 sync "media/$kansio" "$ampari/$kansio" $paate \
              --size-only --no-progress --cache-control "public, max-age=2592000"
          done
          # Manifesti muuttuu joka ajolla ja työhuone lukee sen: lyhyt
          # välimuisti, ettei tilastoihin jää eilistä lukemaa.
          aws s3 cp media/manifesti.json "$ampari/manifesti.json" $paate \
            --content-type application/json --cache-control "public, max-age=300"
          # --delete on tarkoituksella pois: vanha tiedosto ämpärissä ei
          # haittaa ketään, mutta vahingossa tyhjentynyt ämpäri rikkoisi
          # pelin kaikilta kerralla.

      - name: Tarkista että aineisto vastaa ja CORS on kunnossa
        run: |
          set -euo pipefail
          # GET-pyynnöllä: R2 vertaa metodia CORS-säännön
          # AllowedMethods-listaan, eikä HEADiin tule otsaketta lainkaan
          # kun sääntö sallii vain GETin.
          tarkista() {
            vastaus=$(curl -sS -D- -o /dev/null --max-time 30 -r 0-99 \
              -H 'Origin: https://ravelius.github.io' "$JULKINEN/$1")
            koodi=$(printf '%s' "$vastaus" | grep -m1 -oE 'HTTP/[0-9.]+ [0-9]+' | tail -1 | awk '{print $2}')
            cors=$(printf '%s' "$vastaus" | grep -ic '^access-control-allow-origin' || true)
            echo "$1 -> $koodi, CORS $cors"
            case "$koodi" in 200|206) ;; *) exit 1 ;; esac
            test "$cors" != "0"
          }
          for kansio in kuvat liput aanet; do
            [ -d "media/$kansio" ] && tarkista "$kansio/$(ls media/$kansio | head -1)"
          done
          tarkista "manifesti.json"
