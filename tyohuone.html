<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Työhuone — Matkakirja</title>
  <link rel="manifest" href="tyohuone.webmanifest" />
  <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)" />
  <!-- iOS: kotivalikkoon asennettuna aukeaa ilman selaimen palkkeja. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Työhuone" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="assets/tyohuone-apple.png" />
  <link rel="icon" href="assets/tyohuone-192.png" />
  <style>
    /*
     * TYÖHUONEEN ULKOASU ON TARKOITUKSELLA ERI KUIN PELIN.
     *
     * Peli on pergamenttia ja mustetta, ja se on oikein: pelaaja
     * katsoo 1873:n matkakirjaa. Työhuone ei ole matkakirja vaan
     * työkalu, ja työkalussa luettavuus voittaa tunnelman.
     *
     * Kolme eroa pelin ulkoasuun:
     *  1. Kirjasin on laitteen oma päätteetön (SF Pro, Segoe, Roboto).
     *     Vanha työhuone käytti Courier Newiä, joka on kaunis mutta
     *     kapea ja väsyttävä pitkässä luvussa.
     *  2. Tausta on vaalea. Tummalla pohjalla ohut päätteetön teksti
     *     kukkuu, ja työhuoneessa luetaan paljon pientä tekstiä.
     *  3. Yksi korostusväri, ei viittä. Kun kaikki on korostettu,
     *     mikään ei ole.
     *
     * Ainoa tietoinen viittaus peliin on korostusväri: sama kullan
     * sävy kuin kartan musteessa.
     */
    :root {
      color-scheme: light dark;
      --pohja: #f7f5f0;
      --kortti: #ffffff;
      --teksti: #1d2024;
      --himmea: #565b63;
      --haalea: #8a9099;
      --reuna: #dcd8d0;
      --korostus: #9a6b12;
      --korostus-pehmea: rgba(154, 107, 18, 0.1);
      --vihrea: #2e7d5b;
      --punainen: #b3401f;
      --varjo: 0 1px 2px rgba(0, 0, 0, 0.05), 0 4px 14px rgba(0, 0, 0, 0.04);
      --pyoristys: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --pohja: #16181c;
        --kortti: #1e2126;
        --teksti: #e8eaed;
        --himmea: #a8aeb6;
        --haalea: #767c85;
        --reuna: #2e3238;
        --korostus: #e0a94a;
        --korostus-pehmea: rgba(224, 169, 74, 0.14);
        --vihrea: #5ec49a;
        --punainen: #e4805f;
        --varjo: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.2);
      }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--pohja);
      color: var(--teksti);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI',
        Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      /* iPhonen lovi ja kotipalkki. */
      padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* --- yläpalkki ------------------------------------------------------- */

    header {
      position: sticky; top: 0; z-index: 10;
      background: color-mix(in srgb, var(--pohja) 88%, transparent);
      backdrop-filter: saturate(1.6) blur(12px);
      -webkit-backdrop-filter: saturate(1.6) blur(12px);
      border-bottom: 1px solid var(--reuna);
      padding: max(env(safe-area-inset-top), 0.4rem) 0.9rem 0;
    }
    .ylarivi {
      display: flex; align-items: center; gap: 0.6rem;
      min-height: 2.4rem;
    }
    h1 {
      margin: 0; font-size: 1.02rem; font-weight: 600;
      letter-spacing: -0.01em; flex: 1 1 auto;
    }
    /*
     * Versio on nappi, ei koriste: napautus avaa päivityslokin.
     * Vanhassa työhuoneessa versio piilotettiin kapealla ruudulla,
     * ja juuri silloin sitä eniten tarvitsi — puhelimessa ei näe
     * mistä versiosta on kyse.
     */
    .versio {
      font: inherit; font-size: 0.8rem; font-variant-numeric: tabular-nums;
      color: var(--korostus); background: var(--korostus-pehmea);
      border: 0; border-radius: 999px; padding: 0.2rem 0.62rem;
      cursor: pointer; white-space: nowrap;
    }
    .ikoni-nappi {
      font: inherit; font-size: 0.8rem; color: var(--himmea);
      background: none; border: 1px solid var(--reuna); border-radius: 999px;
      padding: 0.2rem 0.62rem; cursor: pointer; white-space: nowrap;
    }
    .ikoni-nappi:disabled { opacity: 0.5; cursor: default; }

    /* Välilehdet: vieritettävä rivi, joka kestää uudet lehdet. */
    nav {
      display: flex; gap: 0.15rem; overflow-x: auto;
      scrollbar-width: none; margin: 0 -0.9rem; padding: 0.25rem 0.9rem 0;
    }
    nav::-webkit-scrollbar { display: none; }
    nav button {
      font: inherit; font-size: 0.88rem; font-weight: 500;
      color: var(--himmea); background: none; border: 0;
      border-bottom: 2px solid transparent;
      padding: 0.45rem 0.7rem 0.5rem; cursor: pointer; white-space: nowrap;
    }
    nav button.paalla { color: var(--korostus); border-bottom-color: var(--korostus); }

    main { padding: 1.1rem 0.9rem 4rem; max-width: 70rem; margin: 0 auto; }
    section[hidden] { display: none; }

    /* --- perustypografia -------------------------------------------------- */

    h2 {
      font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--haalea);
      margin: 1.8rem 0 0.6rem;
    }
    h2:first-child { margin-top: 0; }
    h3 { font-size: 1rem; font-weight: 600; margin: 0 0 0.3rem; }
    p { margin: 0 0 0.7rem; max-width: 44rem; color: var(--himmea); }
    p.iso { color: var(--teksti); }
    a { color: var(--korostus); text-underline-offset: 2px; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.88em; background: var(--korostus-pehmea);
      padding: 0.05em 0.35em; border-radius: 4px;
    }

    .kortti {
      background: var(--kortti); border: 1px solid var(--reuna);
      border-radius: var(--pyoristys); padding: 0.9rem 1rem;
      box-shadow: var(--varjo); margin-bottom: 0.7rem;
    }
    .rivi { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }

    input, select, button.toiminto {
      font: inherit; font-size: 0.95rem;
      color: var(--teksti); background: var(--kortti);
      border: 1px solid var(--reuna); border-radius: 9px;
      padding: 0.5rem 0.7rem;
    }
    input:focus-visible, select:focus-visible, button:focus-visible {
      outline: 2px solid var(--korostus); outline-offset: 1px;
    }
    button.toiminto { cursor: pointer; }

    /* --- tilanne: luvut --------------------------------------------------- */

    .luvut {
      display: grid; gap: 0.6rem;
      grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr));
      margin-bottom: 1rem;
    }
    .luku {
      background: var(--kortti); border: 1px solid var(--reuna);
      border-radius: var(--pyoristys); padding: 0.7rem 0.85rem;
      box-shadow: var(--varjo);
    }
    .luku b {
      display: block; font-size: 1.5rem; font-weight: 600;
      font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    }
    .luku span { font-size: 0.8rem; color: var(--haalea); }

    /* Edistymispalkki: yksi silmäys kertoo, mikä on kesken. */
    .palkki {
      height: 6px; border-radius: 999px; background: var(--reuna);
      overflow: hidden; margin-top: 0.45rem;
    }
    .palkki i { display: block; height: 100%; background: var(--korostus); }
    .palkki.taysi i { background: var(--vihrea); }

    /* --- puutelista ------------------------------------------------------- */

    .puute {
      display: flex; gap: 0.6rem; align-items: baseline;
      padding: 0.45rem 0; border-top: 1px solid var(--reuna);
    }
    .puute:first-child { border-top: 0; }
    .puute b { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 2.6rem; }
    .puute span { color: var(--himmea); font-size: 0.92rem; }
    .puute em { color: var(--haalea); font-style: normal; font-size: 0.85rem; }

    /* --- kaupunkiselain --------------------------------------------------- */

    .kaupunkilista {
      display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0.6rem 0 1rem;
      max-height: 11rem; overflow-y: auto;
    }
    .kaupunkilista button {
      font: inherit; font-size: 0.85rem; color: var(--himmea);
      background: var(--kortti); border: 1px solid var(--reuna);
      border-radius: 999px; padding: 0.25rem 0.66rem; cursor: pointer;
    }
    .kaupunkilista button.paalla {
      color: var(--korostus); border-color: var(--korostus);
      background: var(--korostus-pehmea);
    }
    /* Vajaa kaupunki merkitään pisteellä: silmä löytää sen listasta. */
    .kaupunkilista button.vajaa::after {
      content: '·'; color: var(--punainen); font-weight: 700; margin-left: 0.25rem;
    }

    .lohko { margin-bottom: 1.1rem; }
    .lohko > h3 {
      font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--haalea); margin-bottom: 0.4rem;
    }
    .puuttuu {
      color: var(--haalea); font-size: 0.9rem; font-style: italic;
    }
    .merkinta { border-left: 3px solid var(--korostus); padding-left: 0.8rem; }
    .merkinta p:last-child { margin-bottom: 0; }

    .kuvarivi {
      display: grid; gap: 0.6rem;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }
    .kuva { background: var(--kortti); border: 1px solid var(--reuna);
      border-radius: 8px; overflow: hidden; box-shadow: var(--varjo); }
    .kuva img { display: block; width: 100%; height: 110px; object-fit: cover; background: var(--reuna); }
    .kuva .teksti { padding: 0.4rem 0.5rem 0.5rem; font-size: 0.78rem; color: var(--himmea); }
    .kuva .vuosi { color: var(--haalea); font-size: 0.72rem; }

    .tagi {
      display: inline-block; font-size: 0.74rem; color: var(--haalea);
      border: 1px solid var(--reuna); border-radius: 999px;
      padding: 0.05rem 0.5rem; margin: 0 0.25rem 0.25rem 0;
    }
    .tagi.on { color: var(--vihrea); border-color: var(--vihrea); }
    .tagi.ei { color: var(--punainen); border-color: var(--punainen); }

    /* --- haitari: yksi auki kerrallaan ------------------------------------ */

    details.osio {
      background: var(--kortti); border: 1px solid var(--reuna);
      border-radius: var(--pyoristys); margin-bottom: 0.6rem;
      box-shadow: var(--varjo); overflow: hidden;
    }
    details.osio > summary {
      cursor: pointer; padding: 0.75rem 1rem; font-weight: 600;
      list-style: none; display: flex; align-items: center; gap: 0.5rem;
    }
    details.osio > summary::-webkit-details-marker { display: none; }
    details.osio > summary::after {
      content: '⌄'; margin-left: auto; color: var(--haalea);
      transition: transform 0.15s;
    }
    details.osio[open] > summary::after { transform: rotate(180deg); }
    details.osio > summary small { font-weight: 400; color: var(--haalea); }
    details.osio .sisus { padding: 0 1rem 1rem; }
    details.osio .sisus > :first-child { margin-top: 0; }

    /* --- upotetut kehykset ------------------------------------------------ */

    iframe.kehys {
      width: 100%; height: min(78vh, 46rem); min-height: 22rem;
      border: 1px solid var(--reuna); border-radius: var(--pyoristys);
      background: var(--kortti);
    }

    /* --- päivitysloki ------------------------------------------------------ */

    dialog.loki {
      border: 1px solid var(--reuna); border-radius: var(--pyoristys);
      background: var(--kortti); color: var(--teksti);
      padding: 1rem 1.1rem 0.8rem; width: min(90vw, 26rem);
      max-height: 78vh; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }
    dialog.loki::backdrop { background: rgba(0, 0, 0, 0.35); }
    dialog.loki ol { list-style: none; margin: 0; padding: 0;
      max-height: 58vh; overflow-y: auto; font-size: 0.88rem; }
    dialog.loki li { display: flex; gap: 0.6rem; padding: 0.2rem 0; }
    dialog.loki .v { flex: 0 0 2.6rem; color: var(--haalea);
      font-variant-numeric: tabular-nums; }

    /* Uusi versio saatavilla -palkki. */
    #paivitysvihje {
      position: fixed; left: 0.9rem; right: 0.9rem;
      bottom: calc(0.9rem + env(safe-area-inset-bottom));
      background: var(--korostus); color: #fff; border: 0;
      border-radius: 999px; padding: 0.6rem 1rem; font: inherit;
      font-weight: 600; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      cursor: pointer; z-index: 20; max-width: 26rem; margin: 0 auto;
    }

    table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
    th, td { border-bottom: 1px solid var(--reuna); padding: 0.42rem 0.5rem; text-align: left; }
    th { color: var(--haalea); font-weight: 500; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <div class="ylarivi">
      <h1>Työhuone</h1>
      <button class="versio" id="versio" type="button" aria-haspopup="dialog">–</button>
      <button class="ikoni-nappi" id="paivita" type="button" title="Hakee uusimman version">Päivitä</button>
    </div>
    <nav id="valilehdet">
      <button data-tab="tilanne">Tilanne</button>
      <button data-tab="kaupungit">Kaupungit</button>
      <button data-tab="kartat">Kartat</button>
      <button data-tab="studio">Studio</button>
      <button data-tab="suunnitelma">Suunnitelma</button>
      <button data-tab="kasikirja">Käsikirja</button>
    </nav>
  </header>

  <main>
    <!-- TILANNE: missä projekti on juuri nyt -->
    <section id="tab-tilanne">
      <div class="luvut" id="luvut"></div>

      <h2>Mitä puuttuu</h2>
      <p>Lasketaan suoraan paketeista joka latauksella, joten lista ei voi
         vanhentua. Suurin puute ensin.</p>
      <div class="kortti" id="puutteet"></div>

      <h2>Laudat</h2>
      <div class="kortti" id="laudat"></div>
    </section>

    <!-- KAUPUNGIT: yksi kaupunki kerrallaan, kaikki siitä -->
    <section id="tab-kaupungit" hidden>
      <div class="rivi">
        <select id="kaupunki-lauta"></select>
        <input id="kaupunki-haku" type="search" placeholder="Hae kaupunkia…"
               style="flex:1 1 10rem;max-width:16rem" />
        <label class="rivi" style="gap:0.35rem;font-size:0.88rem;color:var(--himmea)">
          <input type="checkbox" id="vain-vajaat" style="width:auto;padding:0" />
          vain vajaat
        </label>
      </div>
      <div class="kaupunkilista" id="kaupunkilista"></div>
      <div id="kaupunki-kortti"></div>
    </section>

    <!-- KARTAT -->
    <section id="tab-kartat" hidden>
      <div class="rivi" style="margin-bottom:0.6rem">
        <select id="kartta-lauta"></select>
        <a id="kartta-uuteen" href="index.html?lauta=vanhamaailma" target="_blank" rel="noopener">
          <button class="toiminto" type="button">Avaa omaan ikkunaan ↗</button></a>
      </div>
      <iframe id="kartta-kehys" class="kehys" title="Laudan kartta"></iframe>
      <p style="margin-top:0.6rem">Ikkunassa on oikea peli katselutilassa.
         Mikään ei tallennu eikä koske pelattavaan peliin.</p>
    </section>

    <!-- STUDIO -->
    <section id="tab-studio" hidden>
      <iframe id="studio-kehys" class="kehys" title="Äänistudio"></iframe>
      <p class="rivi" style="margin-top:0.6rem">
        <a href="aanet.html" target="_blank" rel="noopener">
          <button class="toiminto" type="button">Avaa omaan ikkunaan ↗</button></a>
      </p>
    </section>

    <!-- SUUNNITELMA: mitä aiotaan rakentaa -->
    <section id="tab-suunnitelma" hidden>
      <div id="suunnitelma"></div>
    </section>

    <!-- KÄSIKIRJA: mihin nojataan -->
    <section id="tab-kasikirja" hidden>
      <div id="kasikirja"></div>
    </section>
  </main>

  <dialog class="loki" id="loki-ikkuna">
    <h3 style="margin-bottom:0.6rem">Päivitysloki</h3>
    <ol id="loki-lista"></ol>
    <button class="toiminto" type="button" id="loki-sulje"
            style="width:100%;margin-top:0.7rem">Sulje</button>
  </dialog>

  <script type="module">
    import { PACKS } from './js/pack.js';
    import { MUUTOKSET } from './js/muutokset.js';
    import {
      AARTEET, VARUSTEET, KAUPUNKIKARTAT, LASIT, PELIT, PELITILAT, LAHTEET, MOOTTORIT,
    } from './js/tyohuone-data.js';

    const $ = (id) => document.getElementById(id);
    const el = (tagi, luokka, teksti) => {
      const n = document.createElement(tagi);
      if (luokka) n.className = luokka;
      if (teksti != null) n.textContent = teksti;
      return n;
    };

    /* ------------------------------------------------------------------ *
     * Sisältötaulut.
     *
     * Työhuone lukee SAMAT moduulit kuin peli, ei kopiota niistä. Siksi
     * sivu ei voi näyttää vanhentunutta tietoa: jos paketti muuttuu,
     * työhuone muuttuu samalla latauksella.
     * ------------------------------------------------------------------ */
    const [
      afrikkaSaap, europeSaap, asiaSaap,
      afrikkaKult, europeKult,
      afrikkaKuvat, europeKuvat, asiaKuvat,
      afrikkaArt, europeArt, asiaArt,
      europeKielet, asiaMaat, afrikkaMaat, europeMaat, radiot, kuvaApu,
    ] = await Promise.all([
      import('./js/packs/africa-saapumiset.js').then((m) => m.AFRICA_SAAPUMISET),
      import('./js/packs/europe-saapumiset.js').then((m) => m.EUROPE_SAAPUMISET),
      import('./js/packs/asia-saapumiset.js').then((m) => m.ASIA_SAAPUMISET),
      import('./js/packs/africa-kulttuuri.js').then((m) => m.AFRICA_KULTTUURI),
      import('./js/packs/europe-kulttuuri.js').then((m) => m.EUROPE_KULTTUURI),
      import('./js/packs/africa-valokuvat.js').then((m) => m.AFRICA_VALOKUVAT),
      import('./js/packs/europe-valokuvat.js').then((m) => m.EUROPE_VALOKUVAT),
      import('./js/packs/asia-valokuvat.js').then((m) => m.ASIA_VALOKUVAT).catch(() => ({})),
      import('./js/packs/africa-artikkelit.js').then((m) => m.OMAT_ARTIKKELIT),
      import('./js/packs/europe-artikkelit.js').then((m) => m.EUROPE_ARTIKKELIT),
      import('./js/packs/asia-artikkelit.js').then((m) => m.ASIA_ARTIKKELIT).catch(() => ({})),
      import('./js/packs/europe-kielet.js').then((m) => m.EUROPE_KIELET),
      import('./js/packs/asia-maatiedot.js').then((m) => m.ASIA_MAATIEDOT).catch(() => ({})),
      import('./js/packs/africa-maatiedot.js').then((m) => m.AFRICA_MAATIEDOT),
      import('./js/packs/europe-maatiedot.js').then((m) => m.EUROPE_MAATIEDOT),
      import('./js/packs/radiot.js').then((m) => m.RADIOT).catch(() => ({})),
      import('./js/packs/africa-valokuvat.js').then((m) => m.valokuvaUrl),
    ]);

    const SAAPUMISET = { ...afrikkaSaap, ...europeSaap, ...asiaSaap };
    const KULTTUURI = { ...afrikkaKult, ...europeKult };
    const KUVAT = { ...afrikkaKuvat, ...europeKuvat, ...asiaKuvat };
    const ARTIKKELIT = { ...afrikkaArt, ...europeArt, ...asiaArt };
    const KIELET = { ...europeKielet };
    const MAATIEDOT = { ...afrikkaMaat, ...europeMaat, ...asiaMaat };

    /* Artikkelin runko on vanhoissa `artikkeli`, uusissa `teksti`. */
    const artikkelinTeksti = (a) => a?.artikkeli ?? a?.teksti ?? null;

    // --- välilehdet -----------------------------------------------------

    const napit = [...document.querySelectorAll('#valilehdet button')];
    /* Vanhat kirjanmerkit eivät saa hajota nimien muuttuessa. */
    const VANHAT = {
      etusivu: 'tilanne', maanosat: 'kartat', aanet: 'studio', tekstit: 'kaupungit',
      kuvat: 'kaupungit', juoni: 'suunnitelma', lasit: 'suunnitelma',
      pelit: 'suunnitelma', brandi: 'kasikirja', tarina: 'kasikirja',
      lahteet: 'kasikirja', moottorit: 'kasikirja',
    };
    function nayta(tab) {
      const kohde = VANHAT[tab] ?? tab;
      const loytyi = napit.some((n) => n.dataset.tab === kohde) ? kohde : 'tilanne';
      for (const n of napit) n.classList.toggle('paalla', n.dataset.tab === loytyi);
      for (const s of document.querySelectorAll('section[id^="tab-"]')) {
        s.hidden = s.id !== `tab-${loytyi}`;
      }
      // Raskaat kehykset ladataan vasta avattaessa.
      if (loytyi === 'studio' && !$('studio-kehys').src) $('studio-kehys').src = 'aanet.html';
      if (loytyi === 'kartat') paivitaKartta();
      history.replaceState(null, '', `#${loytyi}`);
      window.scrollTo(0, 0);
    }
    for (const n of napit) n.addEventListener('click', () => nayta(n.dataset.tab));

    // --- versio ja päivitysloki -----------------------------------------

    /*
     * Versio luetaan pelin lähteestä eikä kirjoiteta tänne käsin: kaksi
     * paikkaa samalle luvulle on oikea korkeintaan toisessa.
     */
    const pelinVersio = await fetch('js/main.js')
      .then((r) => r.text())
      .then((s) => s.match(/APP_VERSION = '([^']+)'/)?.[1] ?? null)
      .catch(() => null);
    $('versio').textContent = pelinVersio ? `v${pelinVersio.split('.').pop()}` : 'v?';
    $('versio').title = pelinVersio ? `Pelin versio ${pelinVersio} — napauta nähdäksesi lokin` : '';

    const lokiIkkuna = $('loki-ikkuna');
    for (const m of MUUTOKSET) {
      const li = el('li');
      li.append(el('span', 'v', `v${m.v}`), el('span', '', m.teksti));
      $('loki-lista').append(li);
    }
    $('versio').addEventListener('click', () => lokiIkkuna.showModal());
    $('loki-sulje').addEventListener('click', () => lokiIkkuna.close());
    lokiIkkuna.addEventListener('click', (e) => { if (e.target === lokiIkkuna) lokiIkkuna.close(); });

    // --- itsestään päivittyminen ----------------------------------------

    /*
     * Kaksi tasoa:
     *  1. Palvelutyöntekijä hakee verkosta ensin, joten sisältö on tuore
     *     aina kun verkko toimii.
     *  2. Jos työhuoneen OMA koodi on muuttunut, selain lataa uuden
     *     työntekijän ja me kerromme siitä palkilla. Ilman ilmoitusta
     *     käyttäjä katsoisi vanhaa sivua tietämättään.
     */
    if ('serviceWorker' in navigator) {
      try {
        const reg = await navigator.serviceWorker.register('tyohuone-sw.js');
        reg.addEventListener('updatefound', () => {
          const uusi = reg.installing;
          if (!uusi) return;
          uusi.addEventListener('statechange', () => {
            if (uusi.state === 'installed' && navigator.serviceWorker.controller) {
              const palkki = el('button', '', 'Uusi versio ladattu — napauta ottaaksesi käyttöön');
              palkki.id = 'paivitysvihje';
              palkki.addEventListener('click', () => location.reload());
              document.body.append(palkki);
            }
          });
        });
        // Tarkistus tunnin välein: työhuone on usein auki koko päivän.
        setInterval(() => reg.update().catch(() => {}), 3600e3);
      } catch { /* ilman työntekijää sivu toimii silti */ }
    }

    $('paivita').addEventListener('click', async () => {
      const nappi = $('paivita');
      nappi.disabled = true;
      nappi.textContent = 'Haetaan…';
      try {
        const regs = await navigator.serviceWorker?.getRegistrations?.() ?? [];
        await Promise.all(regs.map((r) => r.unregister()));
        for (const avain of await caches.keys()) await caches.delete(avain);
      } catch { /* siivous ei ole edellytys */ }
      // Muuttuva parametri kiertää iOS:n oman aloitussivuvälimuistin.
      const url = new URL(location.href);
      url.searchParams.set('p', String(Date.now()));
      location.replace(url.toString());
    });

    // --- kaupunkien tila -------------------------------------------------

    /*
     * Yksi totuus siitä, mitä kaupungilta puuttuu. Sekä puutelista että
     * kaupunkiselaimen merkinnät lukevat tämän — kaksi eri laskentaa
     * ajautuisi väistämättä erilleen.
     */
    const OSAT = [
      { avain: 'saapuminen', nimi: 'päiväkirjamerkintä', on: (c) => Boolean(SAAPUMISET[c.id]) },
      { avain: 'artikkeli', nimi: 'oma artikkeli', on: (c) => Boolean(artikkelinTeksti(ARTIKKELIT[c.wiki ?? c.name])) },
      { avain: 'kuvat', nimi: 'kuvakortti', on: (c) => Boolean(KUVAT[c.id]) },
      { avain: 'kulttuuri', nimi: 'kulttuurinostot', on: (c) => Boolean(KULTTUURI[c.id]) },
      { avain: 'kysymykset', nimi: 'tietovisakysymykset', on: (c, p) => Boolean((p.questions?.[c.id] ?? []).length) },
      { avain: 'aani', nimi: 'äänimaisema', on: (c) => Boolean(c.ambience) },
      { avain: 'maa', nimi: 'maatunnus', on: (c, p) => Boolean(p.map?.cityCountry?.[c.id]) },
      { avain: 'tunnusluvut', nimi: 'maan tunnusluvut', on: (c, p) => Boolean(MAATIEDOT[p.map?.cityCountry?.[c.id]]) },
      { avain: 'kieli', nimi: 'kielinäyte tai radio', on: (c, p) => Boolean(KIELET[c.id] || radiot[p.map?.cityCountry?.[c.id]]) },
    ];
    const puuttuvat = (c, p) => OSAT.filter((o) => !o.on(c, p));

    // --- TILANNE ---------------------------------------------------------

    const paalauta = PACKS.find((p) => p.id === 'vanhamaailma') ?? PACKS[0];
    /*
     * Sama kaupunki on usealla laudalla: Lontoo on sekä Euroopan
     * laudalla että yhdistetyllä vanhalla maailmalla. Puutteet
     * lasketaan KERRAN kaupunkia kohti, muuten sama puute näkyisi
     * listassa kahdesti ja luku olisi 445 vaikka kaupunkeja on 283.
     *
     * Jos kaupunki on monella laudalla, käytetään sitä lautaa, jolla
     * sillä on eniten sisältöä — muuten tyhjä rinnakkaislauta
     * merkitsisi valmiin kaupungin vajaaksi.
     */
    const kaikkiKaupungit = (() => {
      const paras = new Map();
      for (const p of PACKS) {
        for (const c of p.cities) {
          const ehdokas = { c, p, pisteet: OSAT.filter((o) => o.on(c, p)).length };
          const ed = paras.get(c.id);
          if (!ed || ehdokas.pisteet > ed.pisteet) paras.set(c.id, ehdokas);
        }
      }
      return [...paras.values()];
    })();

    function piirraLuvut() {
      const luvut = [
        ['Kaupunkeja', kaikkiKaupungit.length],
        ['Valmiita kaupunkeja', kaikkiKaupungit.filter(({ c, p }) => !puuttuvat(c, p).length).length],
        ['Päiväkirjamerkintöjä', Object.keys(SAAPUMISET).length],
        ['Omia artikkeleita', Object.keys(ARTIKKELIT).length],
        ['Kuvakortteja', Object.keys(KUVAT).length],
        ['Maita tunnusluvuin', Object.keys(MAATIEDOT).length],
        ['Radiolähetyksiä', Object.keys(radiot).length],
        ['Kysymyksiä', PACKS.reduce((s, p) => s + Object.entries(p.questions ?? {})
          .filter(([k]) => k !== 'claims').reduce((a, [, v]) => a + (Array.isArray(v) ? v.length : 0), 0), 0)],
      ];
      $('luvut').replaceChildren(...luvut.map(([nimi, arvo]) => {
        const d = el('div', 'luku');
        d.append(el('b', '', String(arvo)), el('span', '', nimi));
        return d;
      }));
    }

    function piirraPuutteet() {
      const laskurit = new Map(OSAT.map((o) => [o.avain, []]));
      for (const { c, p } of kaikkiKaupungit) {
        for (const o of puuttuvat(c, p)) laskurit.get(o.avain).push(`${c.name} (${p.id})`);
      }
      const rivit = OSAT
        .map((o) => ({ o, lista: laskurit.get(o.avain) }))
        .filter((x) => x.lista.length)
        .sort((a, b) => b.lista.length - a.lista.length)
        .map(({ o, lista }) => {
          const d = el('div', 'puute');
          d.append(
            el('b', '', String(lista.length)),
            el('span', '', `kaupunkia ilman: ${o.nimi}`),
            el('em', '', lista.slice(0, 3).map((x) => x.split(' (')[0]).join(', ')
              + (lista.length > 3 ? ` +${lista.length - 3}` : '')),
          );
          return d;
        });
      $('puutteet').replaceChildren(...(rivit.length ? rivit
        : [el('p', '', 'Ei puutteita — kaikilla kaupungeilla on kaikki osat.')]));
    }

    function piirraLaudat() {
      const taulu = el('table');
      const otsikko = el('tr');
      for (const t of ['Lauta', 'Kaupunkeja', 'Valmiina', 'Osuus']) {
        const th = el('th', t === 'Lauta' ? '' : 'num', t);
        otsikko.append(th);
      }
      taulu.append(el('thead').appendChild(otsikko).parentNode);
      const runko = el('tbody');
      for (const p of PACKS) {
        const valmiit = p.cities.filter((c) => puuttuvat(c, p).length === 0).length;
        const osuus = p.cities.length ? Math.round((valmiit / p.cities.length) * 100) : 0;
        const tr = el('tr');
        tr.append(el('td', '', p.id));
        tr.append(el('td', 'num', String(p.cities.length)));
        tr.append(el('td', 'num', String(valmiit)));
        const td = el('td', 'num');
        td.append(el('span', '', `${osuus} %`));
        const palkki = el('div', osuus === 100 ? 'palkki taysi' : 'palkki');
        const i = el('i');
        i.style.width = `${osuus}%`;
        palkki.append(i);
        td.append(palkki);
        tr.append(td);
        runko.append(tr);
      }
      taulu.append(runko);
      $('laudat').replaceChildren(taulu);
    }

    // --- KAUPUNGIT -------------------------------------------------------

    let valittuLauta = paalauta.id;
    let valittuKaupunki = null;

    $('kaupunki-lauta').replaceChildren(...PACKS.map((p) => {
      const o = el('option', '', `${p.id} (${p.cities.length})`);
      o.value = p.id;
      return o;
    }));
    $('kaupunki-lauta').value = valittuLauta;

    function piirraKaupunkilista() {
      const pack = PACKS.find((p) => p.id === valittuLauta);
      const haku = $('kaupunki-haku').value.trim().toLowerCase();
      const vainVajaat = $('vain-vajaat').checked;
      const napitLista = pack.cities
        .filter((c) => !haku || c.name.toLowerCase().includes(haku) || c.id.includes(haku))
        .filter((c) => !vainVajaat || puuttuvat(c, pack).length > 0)
        .map((c) => {
          const b = el('button', '', c.name);
          b.type = 'button';
          if (puuttuvat(c, pack).length) b.classList.add('vajaa');
          if (c.id === valittuKaupunki) b.classList.add('paalla');
          b.addEventListener('click', () => { valittuKaupunki = c.id; piirraKaupunkilista(); piirraKaupunki(); });
          return b;
        });
      $('kaupunkilista').replaceChildren(...(napitLista.length ? napitLista
        : [el('span', 'puuttuu', 'Ei osumia.')]));
    }

    function lohko(otsikko, sisus) {
      const d = el('div', 'lohko');
      d.append(el('h3', '', otsikko));
      d.append(...(Array.isArray(sisus) ? sisus : [sisus]));
      return d;
    }

    function kuvaKortti(k, vuosiTeksti) {
      const d = el('div', 'kuva');
      const img = el('img');
      img.loading = 'lazy';
      img.alt = k.selite ?? '';
      img.src = kuvaApu(k.tiedosto, 320);
      const t = el('div', 'teksti');
      t.append(el('div', 'vuosi', vuosiTeksti ?? k.vuosi ?? ''), el('div', '', k.selite ?? ''));
      d.append(img, t);
      return d;
    }

    function piirraKaupunki() {
      const pack = PACKS.find((p) => p.id === valittuLauta);
      const c = pack.cities.find((x) => x.id === valittuKaupunki);
      if (!c) { $('kaupunki-kortti').replaceChildren(el('p', 'puuttuu', 'Valitse kaupunki.')); return; }

      const ulos = [];
      const otsikko = el('div', 'kortti');
      otsikko.append(el('h3', '', c.name));
      const tagit = el('div');
      for (const o of OSAT) {
        const on = o.on(c, pack);
        tagit.append(el('span', `tagi ${on ? 'on' : 'ei'}`, `${on ? '✓' : '✗'} ${o.nimi}`));
      }
      otsikko.append(tagit);
      const maa = pack.map?.cityCountry?.[c.id];
      const meta = [c.wiki ? `wiki: ${c.wiki}` : null, c.ambience ? `ääni: ${c.ambience}` : null,
        maa ? `maa: ${maa}` : null].filter(Boolean).join(' · ');
      if (meta) otsikko.append(el('p', '', meta));
      ulos.push(otsikko);

      const s = SAAPUMISET[c.id];
      if (s) {
        const m = el('div', 'merkinta');
        m.append(el('p', 'iso', s.kuvaus), el('p', '', s.nosto));
        ulos.push(lohko('Matkakirjasta', m));
      }

      const a = ARTIKKELIT[c.wiki ?? c.name];
      const teksti = artikkelinTeksti(a);
      if (teksti) {
        const d = el('div');
        d.append(el('p', 'iso', a.intro));
        for (const kappale of teksti.split('\n\n')) d.append(el('p', '', kappale));
        ulos.push(lohko('Oma artikkeli', d));
      }

      const kuvat = KUVAT[c.id];
      if (kuvat) {
        const ruudukko = el('div', 'kuvarivi');
        if (kuvat.tiedosto) ruudukko.append(kuvaKortti(kuvat, kuvat.vuosi));
        for (const l of kuvat.lisat ?? []) ruudukko.append(kuvaKortti(l));
        if (kuvat.uusi) ruudukko.append(kuvaKortti(kuvat.uusi, kuvat.uusi.vuosi ?? 'nykypäivä'));
        ulos.push(lohko(`Kuvakortti (${1 + (kuvat.lisat?.length ?? 0) + (kuvat.uusi ? 1 : 0)} kuvaa)`, ruudukko));
      }

      const kult = KULTTUURI[c.id];
      if (kult?.nostot?.length) {
        const d = el('div');
        for (const n of kult.nostot) {
          const k = el('div', 'kortti');
          k.append(el('h3', '', n.otsikko), el('p', '', n.teksti));
          d.append(k);
        }
        ulos.push(lohko('Kaupungin elämää', d));
      }

      const kysymykset = pack.questions?.[c.id] ?? [];
      if (kysymykset.length) {
        const d = el('div');
        for (const q of kysymykset) {
          const k = el('div', 'kortti');
          k.append(el('h3', '', q.q));
          k.append(el('p', '', q.options.map((o, i) => (i === q.correct ? `✓ ${o}` : o)).join(' · ')));
          if (q.fact) k.append(el('p', '', q.fact));
          d.append(k);
        }
        ulos.push(lohko(`Kysymykset (${kysymykset.length})`, d));
      }

      const md = MAATIEDOT[maa];
      if (md) {
        const d = el('div', 'kortti');
        d.append(el('p', '', `${md.vakiluku} asukasta (${md.vakilukuSija}) · `
          + `${md.pintaAla} (${md.pintaAlaSija}) · ${md.keskitulo.arvo} (${md.keskitulo.sija})`));
        d.append(el('p', '', `Demokratia ${md.demokratia.arvo} (${md.demokratia.sija}) — ${md.demokratia.selitys}`));
        d.append(el('p', '', (md.tervehdykset ?? [])
          .map((t) => `${t.teksti} (${t.kieli})`).join(' · ')));
        ulos.push(lohko('Maan tunnusluvut', d));
      }

      const radio = radiot[maa];
      const kieli = KIELET[c.id];
      if (radio || kieli) {
        const d = el('div', 'kortti');
        if (radio) d.append(el('p', '', `Radio: ${radio.asema}${radio.virallinen ? ' (yleisradio)' : ''}`));
        if (kieli) d.append(el('p', '', `Äänite: ${kieli.nimi}`));
        ulos.push(lohko('Kieli kuuluviin', d));
      }

      const vajaa = puuttuvat(c, pack);
      if (vajaa.length) {
        ulos.push(lohko('Puuttuu', el('p', 'puuttuu', vajaa.map((o) => o.nimi).join(', '))));
      }

      $('kaupunki-kortti').replaceChildren(...ulos);
    }

    for (const id of ['kaupunki-haku', 'vain-vajaat']) {
      $(id).addEventListener('input', piirraKaupunkilista);
    }
    $('kaupunki-lauta').addEventListener('change', () => {
      valittuLauta = $('kaupunki-lauta').value;
      valittuKaupunki = null;
      piirraKaupunkilista();
      piirraKaupunki();
    });

    // --- KARTAT ----------------------------------------------------------

    $('kartta-lauta').replaceChildren(...PACKS.map((p) => {
      const o = el('option', '', p.id);
      o.value = p.id;
      return o;
    }));
    $('kartta-lauta').value = paalauta.id;
    function paivitaKartta() {
      const lauta = $('kartta-lauta').value;
      const osoite = `index.html?lauta=${lauta}&katselu=1`;
      if ($('kartta-kehys').dataset.lauta !== lauta) {
        $('kartta-kehys').src = osoite;
        $('kartta-kehys').dataset.lauta = lauta;
      }
      $('kartta-uuteen').href = osoite;
    }
    $('kartta-lauta').addEventListener('change', paivitaKartta);

    // --- SUUNNITELMA -----------------------------------------------------

    /*
     * Haitari, jossa yksi osio on auki kerrallaan. Omistajan toive:
     * "vain juuri halutut tiedot ovat näkyvissä kerrallaan". Vanhassa
     * työhuoneessa Juoni-välilehti oli neljä listaa allekkain, ja
     * puhelimella niitä vieritti minuutin.
     */
    function haitari(kohde, osiot) {
      const ulos = osiot.map(({ otsikko, maara, rakenna }) => {
        const d = el('details', 'osio');
        const s = el('summary', '', otsikko);
        if (maara != null) s.append(el('small', '', ` ${maara}`));
        d.append(s);
        const sisus = el('div', 'sisus');
        d.append(sisus);
        let rakennettu = false;
        d.addEventListener('toggle', () => {
          if (d.open) {
            for (const muu of ulos) if (muu !== d) muu.open = false;
            if (!rakennettu) { sisus.append(...rakenna()); rakennettu = true; }
          }
        });
        return d;
      });
      kohde.replaceChildren(...ulos);
    }

    const korttiLista = (rivit) => rivit.map(({ otsikko, meta, teksti }) => {
      const k = el('div', 'kortti');
      k.append(el('h3', '', otsikko));
      if (meta) k.append(el('p', '', meta));
      if (teksti) k.append(el('p', '', teksti));
      return k;
    });

    haitari($('suunnitelma'), [
      {
        otsikko: 'Aarteet',
        maara: `${AARTEET.length} kpl`,
        rakenna: () => [
          el('p', '', 'Yksi jokaisesta maanosasta. Nykyiset aarteet säilyvät tarinoineen.'),
          ...korttiLista(AARTEET.map((a) => ({ otsikko: a.aarre, meta: a.maanosa, teksti: PELITILAT[a.tila] ?? a.tila }))),
        ],
      },
      {
        otsikko: 'Varusteet',
        maara: `${VARUSTEET.length} kpl`,
        rakenna: () => [
          el('p', '', 'Matkailijan varusteita, jotka helpottavat matkaa ja oppimista — '
            + 'eivät jalokiviä, jotka ovat pelkkää rahaa.'),
          ...korttiLista(VARUSTEET.map((v) => ({ otsikko: v.nimi, meta: [PELITILAT[v.tila] ?? v.tila, v.vaikutus].filter(Boolean).join(' · '), teksti: v.huomiot }))),
        ],
      },
      {
        otsikko: 'Kaupunkikartat',
        maara: `${KAUPUNKIKARTAT.length} kpl`,
        rakenna: () => [
          el('p', '', 'Kaupungin sisällä aika kuluu hitaammin kuin mantereella, joten '
            + 'pysähtyminen kannattaa. Sisään pääsee vasta kaupungin avaimilla: '
            + 'kaupunki on palkinto eikä oikotie.'),
          ...korttiLista(KAUPUNKIKARTAT.map((k) => ({ otsikko: k.nimi, meta: PELITILAT[k.tila] ?? k.tila, teksti: [k.kuvaus, k.huomiot].filter(Boolean).join(' ') }))),
        ],
      },
      {
        otsikko: 'Lasit',
        maara: `${LASIT.length} kpl`,
        rakenna: () => [
          el('p', '', 'Aarteina löytyvien erikoislasien toiminnallisuudet. Nämä eivät ole '
            + 'minipelejä vaan kerroksia kartan päällä: kartta pysyy paikallaan ja '
            + 'lasien läpi katsottaessa sen päälle piirtyy jotain, mitä paljaalla '
            + 'silmällä ei näe.'),
          ...korttiLista(LASIT.map((l) => ({ otsikko: l.nimi, meta: PELITILAT[l.tila] ?? l.tila, teksti: [l.kuvaus, l.huomiot].filter(Boolean).join(' ') }))),
        ],
      },
      {
        otsikko: 'Peli-ideat',
        maara: `${PELIT.filter((p) => p.tila === 'kaytossa').length}/${PELIT.length} käytössä`,
        rakenna: () => [
          el('p', '', 'Minipelit löytöjen takana. Tänne kirjataan sekä käytössä olevat '
            + 'että ideat, joita mietitään yhdessä.'),
          ...korttiLista(PELIT.map((p) => ({ otsikko: p.nimi, meta: PELITILAT[p.tila] ?? p.tila, teksti: p.kuvaus }))),
        ],
      },
    ]);

    // --- KÄSIKIRJA -------------------------------------------------------

    haitari($('kasikirja'), [
      {
        otsikko: 'Brändikirja',
        maara: 'tarina, ääni, tyyli',
        rakenna: () => {
          const d = el('div');
          d.append(el('p', '', 'Ladataan…'));
          fetch('tyohuone-kasikirja.html')
            .then((r) => r.text())
            .then((html) => { d.innerHTML = html; })
            .catch(() => { d.replaceChildren(el('p', 'puuttuu', 'Käsikirjaa ei saatu haettua.')); });
          return [d];
        },
      },
      {
        otsikko: 'Lähteet',
        maara: `${LAHTEET.length} kpl`,
        rakenna: () => {
          const d = el('div');
          d.append(el('p', '', 'Avoimia aineistolähteitä: kuvia, karttoja, ääntä ja dataa. '
            + 'Tarkista lisenssi aina aineistokohtaisesti — merkintä on lähteen pääsääntö.'));
          for (const l of LAHTEET) {
            const k = el('div', 'kortti');
            const h = el('h3');
            const a = el('a', '', l.nimi);
            a.href = l.url;
            a.target = '_blank';
            a.rel = 'noopener';
            h.append(a);
            k.append(h, el('p', '', [l.tyyppi, l.lisenssi, l.api ? 'API' : null,
              PELITILAT[l.tila] ?? l.tila].filter(Boolean).join(' · ')));
            if (l.idea) k.append(el('p', '', l.idea));
            d.append(k);
          }
          return [d];
        },
      },
      {
        otsikko: 'Moottorit',
        maara: `${MOOTTORIT.length} kpl`,
        rakenna: () => [
          el('p', '', 'Generointi- ja palvelumoottorit. API-avaimia ei koskaan kirjata '
            + 'tänne eikä repoon — ne ovat GitHubin salaisuuksissa.'),
          ...korttiLista(MOOTTORIT.map((m) => ({
            otsikko: m.nimi, meta: [PELITILAT[m.tila] ?? m.tila, m.mita].filter(Boolean).join(' · '),
            teksti: m.huomiot,
          }))),
        ],
      },
    ]);

    // --- käynnistys ------------------------------------------------------

    piirraLuvut();
    piirraPuutteet();
    piirraLaudat();
    piirraKaupunkilista();
    piirraKaupunki();
    nayta((location.hash || '#tilanne').slice(1));
  </script>
</body>
</html>
